<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>박인환 | 사무직</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <nav class="nav nav-left" aria-label="주요 메뉴">
        <a href="#intro">소개</a>
        <a href="#work">업무</a>
        <a href="#contact">문의</a>
      </nav>

      <a href="/" class="logo" aria-label="박인환 홈">
        <span class="logo-dot" aria-hidden="true"></span>
        박인환
      </a>

      <nav class="nav nav-right" aria-label="부가 메뉴">
        <a href="#story">스토리</a>
        <a href="#profile">프로필</a>
      </nav>

      <a href="#contact" class="cta-circle">문의하기</a>
    </header>

    <section class="banner" aria-label="소개 배너">
      <div class="banner-copy">
        <h1>사무직의 전문가, 박인환</h1>
        <p class="banner-sub">
          문서 작성 · 사무 관리 · 프로젝트 지원<br />
          효율적이고 꼼꼼한 업무로<br />
          여러분과 함께 성장합니다
        </p>
        <p class="banner-cta">지금 문의해보세요!</p>
      </div>

      <div class="banner-visual" aria-hidden="true">
        <div class="deco-circle">
          <span class="inner-dot"></span>
          <strong class="job">사무직</strong>
          <span class="name">박인환</span>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
